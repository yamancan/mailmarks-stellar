[workspace]
resolver = "2"
members = ["groth16-verifier", "dkim-registry", "approval-registry", "consumer"]

[workspace.dependencies]
soroban-sdk = "28"
stellar-zk-email = { git = "https://github.com/OpenZeppelin/stellar-contracts", tag = "v0.8.0" }

# Same release profile as soroban-examples/groth16_verifier.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
